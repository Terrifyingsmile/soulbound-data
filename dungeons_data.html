<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dungeons Data</title>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0c0f18;
  --surface: #12172a;
  --surface2: #1a2038;
  --surface3: #222842;
  --border: #2a3356;
  --text: #c8d4e8;
  --text-dim: #6a7a9a;
  --text-faint: #3a4a6a;
  --gold: #c8a453;
  --gold-light: #e8c474;
  --green: #48a870;
  --orange: #d88040;
  --red: #c84050;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  line-height: 1.5;
  min-height: 100vh;
}

/* ── Header ── */
.page-header {
  background: linear-gradient(135deg, #0c0f18 0%, #14192e 60%, #0c0f18 100%);
  border-bottom: 2px solid var(--gold);
  padding: 18px 24px 16px;
  display: flex;
  align-items: center;
  gap: 14px;
}
.page-title {
  font-family: 'Exo 2', sans-serif;
  font-size: 22px;
  font-weight: 800;
  color: var(--gold-light);
  letter-spacing: 3px;
  text-transform: uppercase;
}
.page-subtitle {
  font-size: 11px;
  color: var(--text-dim);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-top: 2px;
}

/* ── Zone tabs (outer) ── */
.zone-tabs {
  display: flex;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  scrollbar-width: none;
}
.zone-tabs::-webkit-scrollbar { display: none; }
.zone-tab {
  font-family: 'Exo 2', sans-serif;
  font-weight: 700;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  padding: 14px 22px;
  color: var(--text-dim);
  cursor: pointer;
  border-bottom: 3px solid transparent;
  white-space: nowrap;
  transition: color .15s, border-color .15s, background .15s;
  user-select: none;
  flex-shrink: 0;
}
.zone-tab:hover { color: var(--text); background: var(--surface2); }
.zone-tab.active { color: var(--gold-light); border-bottom-color: var(--gold); background: var(--surface2); }

/* ── Zone panels ── */
.zone-panel { display: none; }
.zone-panel.active { display: block; }

/* ── Difficulty tabs (inner) ── */
.diff-bar {
  display: flex;
  align-items: flex-end;
  gap: 2px;
  padding: 14px 16px 0;
  background: var(--surface2);
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.diff-tab {
  font-family: 'Exo 2', sans-serif;
  font-weight: 600;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  padding: 8px 18px;
  color: var(--text-dim);
  cursor: pointer;
  border-radius: 6px 6px 0 0;
  border: 1px solid transparent;
  border-bottom: none;
  transition: color .15s, background .15s;
  user-select: none;
  white-space: nowrap;
}
.diff-tab:hover { color: var(--text); background: rgba(255,255,255,.04); }
.diff-tab.active {
  background: var(--surface);
  border-color: var(--border);
  border-bottom-color: var(--surface);
  margin-bottom: -1px;
}
.diff-tab.active.n { color: #5abf82; }
.diff-tab.active.h { color: #e09040; }
.diff-tab.active.e { color: #e05060; }
.diff-tab.active.v { color: var(--gold-light); }
.diff-tab.active.r { color: #9080d8; }

/* ── Diff panels ── */
.diff-panel { display: none; padding: 18px 16px 24px; }
.diff-panel.active { display: block; }

/* ── Drop table ── */
.drop-table {
  width: 100%;
  border-collapse: collapse;
  min-width: 520px;
}
.drop-wrap { overflow-x: auto; }
.drop-table thead tr {
  background: var(--surface3);
  border-bottom: 2px solid var(--border);
}
.drop-table thead th {
  font-family: 'Exo 2', sans-serif;
  font-weight: 700;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--text-dim);
  padding: 9px 14px;
  text-align: left;
  white-space: nowrap;
}
.drop-table thead th.c { text-align: center; }
.drop-table tbody tr { border-bottom: 1px solid rgba(42,51,86,.7); transition: background .1s; }
.drop-table tbody tr:last-child { border-bottom: none; }
.drop-table tbody tr:hover { background: rgba(255,255,255,.02); }
.drop-table td { padding: 9px 14px; vertical-align: top; }
.drop-table td.c { text-align: center; }

/* ── Category badge ── */
.badge {
  display: inline-flex;
  align-items: center;
  padding: 3px 9px;
  border-radius: 4px;
  font-family: 'Exo 2', sans-serif;
  font-weight: 700;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  white-space: nowrap;
  border: 1px solid;
}
.b-gold    { background: rgba(245,200,66,.1);  color: #f0c060; border-color: rgba(245,200,66,.25); }
.b-mat     { background: rgba(100,160,220,.1); color: #7ab8e0; border-color: rgba(100,160,220,.25); }
.b-comp    { background: rgba(80,190,130,.1);  color: #60c890; border-color: rgba(80,190,130,.25); }
.b-core    { background: rgba(160,120,220,.1); color: #b090e0; border-color: rgba(160,120,220,.25); }
.b-power   { background: rgba(220,100,160,.1); color: #d880b0; border-color: rgba(220,100,160,.25); }
.b-food    { background: rgba(220,165,80,.1);  color: #d8a860; border-color: rgba(220,165,80,.25); }
.b-potion  { background: rgba(80,200,220,.1);  color: #60c8d8; border-color: rgba(80,200,220,.25); }
.b-gear    { background: rgba(220,70,90,.1);   color: #e06070; border-color: rgba(220,70,90,.25); }
.b-recipe  { background: rgba(100,200,100,.1); color: #80c880; border-color: rgba(100,200,100,.25); }
.b-refresh { background: rgba(90,120,220,.1);  color: #7090e0; border-color: rgba(90,120,220,.25); }
.b-essence { background: rgba(140,210,190,.1); color: #90d0c0; border-color: rgba(140,210,190,.25); }
.b-bonus   { background: rgba(210,190,80,.1);  color: #d0c860; border-color: rgba(210,190,80,.25); }
.b-upgrade { background: rgba(200,90,130,.1);  color: #c06090; border-color: rgba(200,90,130,.25); }
.b-lunar   { background: rgba(190,150,255,.1); color: #c0a0ff; border-color: rgba(190,150,255,.25); }

/* ── Table pct ── */
.tpct {
  font-family: 'Exo 2', sans-serif;
  font-weight: 700;
  font-size: 12px;
  white-space: nowrap;
  color: var(--text-dim);
}
.tpct.always { color: #f0c060; }
.tpct.high   { color: #5abf82; }
.tpct.med    { color: var(--text-dim); }
.tpct.low    { color: #b05060; }

/* ── Item list ── */
.ilist { display: flex; flex-direction: column; gap: 3px; }
.irow  { display: flex; align-items: baseline; gap: 8px; line-height: 1.4; }
.iname { color: var(--text); flex: 1; min-width: 140px; }
.iqty  { color: var(--text-dim); font-size: 11px; white-space: nowrap; }
.ipct  { color: var(--text-dim); font-size: 11px; white-space: nowrap; min-width: 52px; text-align: right; font-family: 'Exo 2', sans-serif; font-weight: 600; }
.ipct.hot  { color: #5abf82; }
.ipct.warm { color: #c8a453; }
.ipct.cool { color: var(--text-dim); }
.ipct.cold { color: #905060; }

/* ── Section note ── */
.sect-note {
  font-size: 11px;
  color: var(--text-dim);
  background: var(--surface3);
  border-left: 3px solid var(--border);
  padding: 8px 14px;
  margin-bottom: 14px;
  border-radius: 0 6px 6px 0;
  font-style: italic;
}
</style>
</head>

<div class="page-header">

// ── helpers ──────────────────────────────────────────────────
function pctClass(p) {
  const v = parseFloat(p);
  if (v >= 50) return 'hot';
  if (v >= 15) return 'warm';
  if (v >= 5)  return 'cool';
  return 'cold';
}
function tpctClass(p) {
  if (!p || p === '—') return 'med';
  const v = parseFloat(p);
  if (v >= 100) return 'always';
  if (v >= 50)  return 'high';
  if (v >= 20)  return 'med';
  return 'low';
}
function renderTable(groups) {
  const rows = groups.map(g => {
    const items = g.items.map(i => `
      <div class="irow">
        <span class="iname">${i.name}</span>
        <span class="iqty">${i.qty ? '×'+i.qty : ''}</span>
        <span class="ipct ${pctClass(i.pct)}">${i.pct}</span>
      </div>`).join('');
    return `<tr>
      <td style="width:130px"><span class="badge ${g.cls}">${g.cat}</span></td>
      <td class="c" style="width:72px"><span class="tpct ${tpctClass(g.tpct)}">${g.tpct||'—'}</span></td>
      <td><div class="ilist">${items}</div></td>
    </tr>`;
  }).join('');
  return `<div class="drop-wrap"><table class="drop-table">
    <thead><tr>
      <th>Category</th><th class="c">Table %</th><th>Item · Qty · Item %</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}
function zone(id, panels, note) {
  const tabs = panels.map((p,i)=>`<div class="diff-tab ${p.cls||'v'}${i===0?' active':''}" data-zone="${id}" data-diff="${p.key}">${p.label}</div>`).join('');
  const pnls = panels.map((p,i)=>`<div class="diff-panel${i===0?' active':''}" id="${id}-${p.key}">${p.note?`<p class="sect-note">${p.note}</p>`:''}${renderTable(p.data)}</div>`).join('');
  return `<div class="diff-bar" data-zone="${id}">${tabs}</div>${pnls}`;
}

// ── render ────────────────────────────────────────────────────
const content = document.getElementById('content');
Object.entries(ZONES).forEach(([id, z], zi) => {
  const el = document.createElement('div');
  el.className = 'zone-panel' + (zi===0 ? ' active' : '');
  el.id = 'zone-'+id;
  el.innerHTML = zone(id, z.panels);
  content.appendChild(el);
});

// ── tab switching ─────────────────────────────────────────────
document.getElementById('zoneTabs').addEventListener('click', e => {
  const t = e.target.closest('.zone-tab');
  if (!t) return;
  document.querySelectorAll('.zone-tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.zone-panel').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  document.getElementById('zone-'+t.dataset.zone)?.classList.add('active');
});
content.addEventListener('click', e => {
  const t = e.target.closest('.diff-tab');
  if (!t) return;
  const {zone, diff} = t.dataset;
  t.closest('.diff-bar').querySelectorAll('.diff-tab').forEach(x=>x.classList.remove('active'));
  document.getElementById('zone-'+zone)?.querySelectorAll('.diff-panel').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  document.getElementById(zone+'-'+diff)?.classList.add('active');
});
